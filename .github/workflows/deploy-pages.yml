name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache-bust static assets
        # Appends ?v=<short-sha> to script/style/data links so browsers can't
        # keep serving a stale cached copy after a deploy (GitHub Pages sets
        # Cache-Control: max-age=600 on these files).
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          sed -i "s#js/app\.js\"#js/app.js?v=${SHA_SHORT}\"#" index.html
          sed -i "s#css/style\.css\"#css/style.css?v=${SHA_SHORT}\"#" index.html
          sed -i "s#data/weapons\.js\"#data/weapons.js?v=${SHA_SHORT}\"#" index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
